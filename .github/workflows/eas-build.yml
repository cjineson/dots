name: EAS iOS Build

on:
  push:
    branches:
      - main

jobs:
  build:
    name: EAS iOS Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Show Expo account (requires EXPO_TOKEN secret)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret is not set. Set it in repo Settings → Secrets → Actions.";
            exit 1;
          fi
          eas whoami || true

      - name: Optional: write App Store Connect key file (set APP_STORE_CONNECT_KEY_BASE64 secret)
        if: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 != '' }}
        run: |
          echo "Writing App Store Connect key file..."
          echo "${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}" | base64 --decode > ./appstore_connect_key.p8

      - name: Start EAS build (iOS)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          # Run a non-interactive EAS cloud build for iOS. Ensure EXPO_TOKEN and (optionally) App Store Connect secrets are set.
          eas build --platform ios --profile production --non-interactive
