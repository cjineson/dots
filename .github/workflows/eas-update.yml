name: EAS Update (publish)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  eas-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Login to Expo (using EXPO_TOKEN)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas whoami || eas login --token "$EXPO_TOKEN"

      - name: Link project (non-interactive)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          # Link this repo to the Expo project (non-interactive)
          eas init --id "$EAS_PROJECT_ID" --non-interactive || true
          # Show eas.json/app.json to help debug
          echo "eas.json:"
          cat eas.json || true
          echo "app.json expo block:"
          node -e "try{console.log(require('./app.json').expo)}catch(e){console.log('no app.json or parse error')}" || true

      - name: EAS Update (create OTA update)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: |
          eas update --branch main --message "CI update from GitHub Actions" --platform all --non-interactive
