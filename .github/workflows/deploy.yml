name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Login to Expo (using EXPO_TOKEN)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas whoami || eas login --token "$EXPO_TOKEN"

      - name: Link project (non-interactive)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          # Link this repo to the Expo project (non-interactive)
          eas init --id "$EAS_PROJECT_ID" --non-interactive || true
          # Show eas.json/app.json to help debug
          echo "eas.json:"
          cat eas.json || true
          echo "app.json expo block:"
          node -e "try{console.log(require('./app.json').expo)}catch(e){console.log('no app.json or parse error')}" || true

      - name: Work out version and stamp build info
        id: version
        run: npx tsx scripts/release-version.ts

      - name: Publish OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: |
          eas update --branch main --message "v${{ steps.version.outputs.version }} (${GITHUB_SHA::7})" --platform all --non-interactive

      - name: Tag release
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; skipping tag"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
